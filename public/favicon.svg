<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Inventory Planning">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- Rounded background -->
  <rect width="64" height="64" rx="14" ry="14" fill="url(#bg)"/>
  <rect width="64" height="64" rx="14" ry="14" fill="url(#shine)"/>
  <!-- Package / box icon -->
  <g transform="translate(14,18)" stroke="#ffffff" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" fill="none">
    <!-- Top face -->
    <path d="M18 0 L34 8 L18 16 L2 8 Z" fill="#ffffff" fill-opacity="0.15"/>
    <!-- Left face -->
    <path d="M2 8 L2 26 L18 34 L18 16 Z" fill="#ffffff" fill-opacity="0.08"/>
    <!-- Right face -->
    <path d="M34 8 L34 26 L18 34 L18 16 Z" fill="#ffffff" fill-opacity="0.22"/>
    <!-- Middle line -->
    <path d="M18 16 L18 34"/>
    <!-- Top crease -->
    <path d="M10 4 L26 12"/>
  </g>
  <!-- HA letters bottom right -->
  <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-weight="800" fill="#ffffff">
    <text x="40" y="58" font-size="11" letter-spacing="-0.5">HA</text>
  </g>
</svg>
